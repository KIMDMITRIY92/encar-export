name: Курсы валют

on:
  schedule:
    - cron: "10 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Update rates
        run: node update-fx.mjs
      - name: Commit if changed
        run: |
          git config user.name  "encar-fx-bot"
          git config user.email "encar-fx-bot@users.noreply.github.com"
          git add fx.js
          git diff --staged --quiet || git commit -m "FX $(date -u +%d.%m.%Y)"
          git push
